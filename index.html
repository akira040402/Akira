<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akira Terminal</title>
<style>
body{background-color:#121212;color:#00FF00;font-family:'Courier New',Courier,monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;overflow:hidden}
.terminal-window{background-color:#000000;border:2px solid #333;border-radius:8px;width:95%;max-width:650px;box-shadow:0 0 20px rgba(0,255,0,0.2);padding:15px}
.terminal-header{display:flex;gap:8px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%}
.red{background-color:#ff5f56}
.yellow{background-color:#ffbd2e}
.green{background-color:#27c93f}
.terminal-body{white-space:pre;line-height:1.1;font-size:13px;text-shadow:0 0 5px rgba(0,255,0,0.7)}
.cursor{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:600px){.terminal-body{font-size:9px;line-height:1.0}}
</style>
</head>
<body>
<div class="terminal-window">
<div class="terminal-header">
<div class="dot red"></div>
<div class="dot yellow"></div>
<div class="dot green"></div>
</div>
<div class="terminal-body" id="terminal-output"></div>
</div>
<script>
const output=document.getElementById('terminal-output');
const frames=[
`       .0111111111111110.
     .0100000000000000000010.
   0100000000011111110000000010
  010000000001100000110000000010
  010000000001100000110000000010
   0100000000011111110000000010
     '0100000000000000000010'
       '0111111111111110'`,
`       .0000000000000000.
     .0000000000000000000000.
   0000000000011111110000000000
  000000000001100000110000000000
  000000000001100000110000000000
   0000000000011111110000000000
     '0000000000000000000000'
       '0000000000000000'`,
`       .----------------.
     .------------------------.
   ------------------------------
   ------------------------------
   ------------------------------
     '------------------------'
       '----------------'`
];
const header="👨‍💻 SYSTEM ACCESS: GRANTED 👨‍💻\n\n";
const footer="\n\n> SCANNING TARGET...";
let state=0;
function loopAnimation(){
let delay=150;
let currentFrame=0;
if(state===0){currentFrame=0;delay=1500;state=1;}
else if(state===1){currentFrame=1;delay=150;state=2;}
else if(state===2){currentFrame=2;delay=150;state=3;}
else if(state===3){currentFrame=1;delay=150;state=0;}
output.innerHTML=header+frames[currentFrame]+footer+'\n<span class="cursor">█</span>';
setTimeout(loopAnimation,delay);
}
loopAnimation();
</script>
</body>
</html>
